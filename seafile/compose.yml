services:
  seafile:
    image: seafileltd/seafile-mc:13.0.25@sha256:90c1aaa08731116750cd7ce16cbc6afe0c26006433002d3c7215a5f4254ec244
    restart: always
    deploy:
      resources:
        limits:
          memory: '2G'
          cpus: '2.0'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:80 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      SEAFILE_MYSQL_DB_HOST: db
      SEAFILE_MYSQL_DB_USER: user
      SEAFILE_MYSQL_DB_PASSWORD: password
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: root
      TIME_ZONE: Europe/Berlin
      INIT_SEAFILE_ADMIN_EMAIL: ${PRIVATE_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: admin
      SEAFILE_SERVER_HOSTNAME: ${SEAFILE_SERVER_HOSTNAME}
      SEAFILE_SERVER_PROTOCOL: https
      SITE_ROOT: /
      NON_ROOT: false
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      SEAFILE_LOG_TO_STDOUT: false
      ENABLE_GO_FILESERVER: true
      ENABLE_SEADOC: true
      SEADOC_SERVER_URL: https://${SEADOC_SERVER_HOSTNAME}
      CACHE_PROVIDER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ${DIRECTORY}/shared:/shared
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${SEAFILE_SERVER_HOSTNAME}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/seafile.webp
      - traefik.enable=true
      - traefik.http.routers.seafile.rule=Host(`${SEAFILE_SERVER_HOSTNAME}`)
      - traefik.http.routers.seafile.entrypoints=https
      - traefik.http.routers.seafile.tls=true
      - traefik.http.routers.seafile.tls.certresolver=desec
    expose:
      - 80
    networks:
      - proxy
      - net

  db:
    image: mariadb:10.11.18@sha256:8020e05c4c498d06c87f0a1db010eb79bd6f8fb30e9b763d4690c34ce1e61008
    restart: always
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    healthcheck:
      test:
        [
          'CMD',
          '/usr/local/bin/healthcheck.sh',
          '--connect',
          '--mariadbupgrade',
          '--innodb_initialized',
        ]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_LOG_CONSOLE: true
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - db:/var/lib/mysql
    labels:
      - backup.target=${BACKUP_TARGET:-seafile}
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/mariadb.webp
    expose:
      - 3306
    networks:
      - net

  redis:
    image: redis:8.10.0@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
    restart: always
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping || exit 1']
    volumes:
      - redis:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/redis.webp
    expose:
      - 6379
    networks:
      - net

  seadoc:
    image: seafileltd/sdoc-server:2.0.9@sha256:5b1bf5a8bfdb8bc5db957e7faee2220111fd6eff00795eaaf172e2f80bb999a5
    restart: always
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: seahub_db
      TIME_ZONE: Europe/Berlin
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      NON_ROOT: false
      SEAHUB_SERVICE_URL: https://${SEAFILE_SERVER_HOSTNAME}
    volumes:
      - seadoc:/shared
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/seafile.webp
      - traefik.enable=true
      - traefik.http.routers.seadoc.rule=Host(`${SEADOC_SERVER_HOSTNAME}`)
      - traefik.http.routers.seadoc.entrypoints=https
      - traefik.http.routers.seadoc.tls=true
      - traefik.http.routers.seadoc.tls.certresolver=desec
    expose:
      - 80
    networks:
      - net
      - proxy

networks:
  proxy:
    external: true
  net:
    external: false

volumes:
  db: {}
  redis: {}
  seadoc: {}
