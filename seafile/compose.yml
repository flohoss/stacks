services:
  seafile:
    image: seafileltd/seafile-mc:14.0.9@sha256:75d8b88e8bfaa54099082aec0e99ff1a962bd364bfc21da34125fa66998f0861
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '2G'
          cpus: '2.0'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:80 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      SEAFILE_MYSQL_DB_HOST: db
      SEAFILE_MYSQL_DB_USER: user
      SEAFILE_MYSQL_DB_PASSWORD: password
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      INIT_SEAFILE_MYSQL_ROOT_PASSWORD: root
      TIME_ZONE: Europe/Berlin
      INIT_SEAFILE_ADMIN_EMAIL: ${PRIVATE_EMAIL}
      INIT_SEAFILE_ADMIN_PASSWORD: admin
      SEAFILE_SERVER_HOSTNAME: ${DOMAIN}
      SEAFILE_SERVER_PROTOCOL: https
      SITE_ROOT: /
      NON_ROOT: false
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      SEAFILE_LOG_TO_STDOUT: false
      ENABLE_GO_FILESERVER: true
      ENABLE_SEADOC: true
      # Reverse proxy needs two rules against seadoc:80: `/sdoc-server` with the
      # prefix stripped, and `/socket.io` with the full path preserved (the editor
      # connects to <origin>/socket.io, not under the prefix).
      SEADOC_SERVER_URL: https://${DOMAIN}/sdoc-server
      CACHE_PROVIDER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENABLE_NOTIFICATION_SERVER: true
      # Reverse proxy: `/notification` -> notification:8083. The server answers on
      # both / and /notification, so stripping or preserving the prefix both work.
      NOTIFICATION_SERVER_URL: https://${DOMAIN}/notification
      INNER_NOTIFICATION_SERVER_URL: http://notification:8083
    volumes:
      - ${DIRECTORY}/shared:/shared
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/seafile.webp
    ports:
      - '${SEAFILE_HOST_BINDING:-127.0.0.1:80}:80'
    networks:
      - net

  seadoc:
    image: seafileltd/sdoc-server:3.0.6@sha256:324113195143e713a170f41ef894c01346170765a54b1aae3366ef2fe5b3de14
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: seahub_db
      TIME_ZONE: Europe/Berlin
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      NON_ROOT: false
      SEAHUB_SERVICE_URL: http://seafile:80
    volumes:
      - seadoc:/shared
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/seafile.webp
    ports:
      - '${SEADOC_HOST_BINDING:-127.0.0.1:8082}:80'
    networks:
      - net

  notification:
    image: seafileltd/notification-server:14.0.8@sha256:f442e9ae3a12f0f30371e054f30b8edf692a20e1331a6b81d4e5f51d49de8e94
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    depends_on:
      db:
        condition: service_healthy
      seafile:
        condition: service_healthy
    environment:
      SEAFILE_MYSQL_DB_HOST: db
      SEAFILE_MYSQL_DB_USER: user
      SEAFILE_MYSQL_DB_PASSWORD: password
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      SEAFILE_LOG_TO_STDOUT: true
      NOTIFICATION_SERVER_LOG_LEVEL: info
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/seafile.webp
    ports:
      - '${NOTIFICATION_HOST_BINDING:-127.0.0.1:8083}:8083'
    networks:
      - net

  onlyoffice:
    image: onlyoffice/documentserver:10.0.0@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '2G'
          cpus: '2.0'
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    volumes:
      - onlyoffice:/var/lib/onlyoffice
    labels:
      - net.unraid.docker.managed=composeman
      # Reverse Proxy: `/oods` -> onlyoffice:80.
      # Set the proxy to strip the prefix and send custom header `X-Forwarded-Prefix: /oods`.
      - net.unraid.docker.webui=https://${DOMAIN}/oods
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/onlyoffice.webp
    ports:
      - '${ONLYOFFICE_HOST_BINDING:-127.0.0.1:8084}:80'
    networks:
      - net

  db:
    image: mariadb:10.11.19@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh', '--connect', '--mariadbupgrade', '--innodb_initialized']
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_LOG_CONSOLE: true
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - db:/var/lib/mysql
    labels:
      - backup.target=${BACKUP_TARGET:-seafile}
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/mariadb.webp
    expose:
      - 3306
    networks:
      - net

  redis:
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping || exit 1']
    volumes:
      - redis:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/redis.webp
    expose:
      - 6379
    networks:
      - net

networks:
  net:
    external: false

volumes:
  db: {}
  redis: {}
  seadoc: {}
  onlyoffice: {}
