services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:1.0.20260223@sha256:10db56ad834f94541307d5dfdbe87370e26d155bb341a5bf65789f970f24ab5c
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/Europe
      - SERVERURL=${SERVERURL:-auto}
      - SERVERPORT=${WG_PORT:-51820}
      - PEERS=${PEERS:-1}
    volumes:
      - config:/config
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/wireguard.webp
    ports:
      - '${WG_PORT:-51820}:51820/udp'

volumes:
  config:
