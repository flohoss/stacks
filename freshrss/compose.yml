services:
  freshrss:
    image: freshrss/freshrss:1.30.2@sha256:a4a4a2233c082940b3ed5a32e2bf12d6c5271062be7e34c188dec99816540fc4
    restart: always
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    logging:
      options:
        max-size: 5m
        max-file: '2'
    extra_hosts:
      - ${EXTRA_HOSTS:-localhost:127.0.0.1}
    environment:
      TZ: Europe/Berlin
      BASE_URL: https://${DOMAIN}
      CRON_MIN: '2,32'
      OIDC_ENABLED: 1
      OIDC_PROVIDER_METADATA_URL: ${OIDC_PROVIDER_METADATA_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_CLIENT_CRYPTO_KEY: ${OIDC_CLIENT_CRYPTO_KEY}
      OIDC_SCOPES: openid email profile
      OIDC_X_FORWARDED_HEADERS: X-Forwarded-Proto X-Forwarded-Host
      OIDC_REMOTE_USER_CLAIM: preferred_username
      INTERNAL_HOST_ALLOWLIST: ${INTERNAL_HOST_ALLOWLIST:-*}
      LISTEN: 0.0.0.0:80
    volumes:
      - ${DIRECTORY}/data:/var/www/FreshRSS/data
      - ${DIRECTORY}/extensions:/var/www/FreshRSS/extensions
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/freshrss.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8000}:80'
