services:
  freshrss:
    image: freshrss/freshrss:1.30.1@sha256:48b63b9bc3d042a1301c32971b01af8841c7f059b452589c5bf77f475ba44c61
    restart: always
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    logging:
      options:
        max-size: 5m
        max-file: '2'
    environment:
      TZ: Europe/Berlin
      BASE_URL: https://${DOMAIN}
      CRON_MIN: '2,32'
      OIDC_ENABLED: 1
      OIDC_PROVIDER_METADATA_URL: ${OIDC_PROVIDER_METADATA_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: openid email profile
      OIDC_X_FORWARDED_HEADERS: X-Forwarded-Proto X-Forwarded-Host
      OIDC_REMOTE_USER_CLAIM: preferred_username
      INTERNAL_HOST_ALLOWLIST: ${INTERNAL_HOST_ALLOWLIST:-localhost,127.0.0.1,::1}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16}
    volumes:
      - ${DIRECTORY}/data:/var/www/FreshRSS/data
      - ${DIRECTORY}/extensions:/var/www/FreshRSS/extensions
    ports:
      - ${PORTS:-8080}:8080
