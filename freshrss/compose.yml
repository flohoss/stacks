services:
  freshrss:
    image: freshrss/freshrss:1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
    restart: always
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    extra_hosts:
      - '${EXTRA_HOSTS:-localhost:127.0.0.1}'
    logging:
      options:
        max-size: 10m
    environment:
      TZ: Europe/Berlin
      BASE_URL: https://${DOMAIN}
      CRON_MIN: '2,32'
      OIDC_ENABLED: 1
      OIDC_PROVIDER_METADATA_URL: ${OIDC_PROVIDER_METADATA_URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: openid email profile
      OIDC_X_FORWARDED_HEADERS: X-Forwarded-Proto X-Forwarded-Host
      OIDC_REMOTE_USER_CLAIM: preferred_username
      INTERNAL_HOST_ALLOWLIST: ${INTERNAL_HOST_ALLOWLIST:-localhost,127.0.0.1,::1}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16}
    volumes:
      - ${DIRECTORY}/data:/var/www/FreshRSS/data
      - ${DIRECTORY}/extensions:/var/www/FreshRSS/extensions
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/freshrss.webp
      - traefik.enable=true
      - traefik.http.routers.freshrss.entrypoints=https
      - traefik.http.routers.freshrss.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.freshrss.tls=true
      - traefik.http.routers.freshrss.tls.certresolver=hetzner
    expose:
      - 8080
    networks:
      - proxy

networks:
  proxy:
    external: true
