services:
  traefik:
    image: traefik:v3.7.13@sha256:1c32e7c368204fd72812152ebdd2ac0425993df6fd982317deb02e48f2d5423c
    restart: always
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    command: >
      --api.dashboard=true
      --api.insecure=true
      --global.checkNewVersion=false
      --global.sendAnonymousUsage=false
      --experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      --experimental.plugins.bouncer.version=v1.7.1
      --entrypoints.http.address=:80
      --entrypoints.http.http.redirections.entryPoint.to=https
      --entrypoints.https.address=:443
      --entrypoints.https.transport.respondingTimeouts.readTimeout=600s
      --entrypoints.https.transport.respondingTimeouts.idleTimeout=600s
      --entrypoints.https.transport.respondingTimeouts.writeTimeout=600s
      --entrypoints.https.http.encodedCharacters.allowEncodedSlash=true
      --entrypoints.https.http.encodedCharacters.allowEncodedQuestionMark=true
      --entrypoints.https.http.middlewares=crowdsec@file,security-headers@file
      --entrypoints.https.http.tls.certresolver=hetzner
      --accesslog=true
      --accesslog.filepath=/var/log/traefik/access.log
      --accesslog.format=json
      --accesslog.bufferingsize=0
      --providers.providersThrottleDuration=2s
      --providers.file.watch=true
      --providers.file.directory=/etc/traefik/config
      --providers.docker=true
      --providers.docker.exposedbydefault=false
      --providers.docker.network=proxy
      --certificatesresolvers.hetzner.acme.email=${PRIVATE_EMAIL}
      --certificatesresolvers.hetzner.acme.storage=/etc/traefik/acme.json
      --certificatesresolvers.hetzner.acme.dnschallenge.provider=hetzner
      --certificatesresolvers.hetzner.acme.dnschallenge.resolvers=hydrogen.ns.hetzner.com:53,oxygen.ns.hetzner.com:53
      --certificatesresolvers.hetzner.acme.dnschallenge.propagation.disableanschecks=true
      --certificatesresolvers.hetzner.acme.dnschallenge.delaybeforecheck=120
      --log.level=ERROR
      --serversTransport.insecureSkipVerify=true
      ${TRAEFIK_EXTRA_FLAGS:-}
    environment:
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN}
    volumes:
      - ${DIRECTORY}:/etc/traefik
      - ${DIRECTORY}/logs:/var/log/traefik
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/traefik.webp
    ports:
      - '80:80'
      - '443:443'
      - '8080:8080'
    networks:
      - proxy
    depends_on:
      crowdsec:
        condition: service_started
      logrotate:
        condition: service_started

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    restart: always
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      COLLECTIONS: crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios
      CUSTOM_HOSTNAME: crowdsec
      BOUNCER_KEY_TRAEFIK: ${CROWDSEC_BOUNCER_KEY}
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - ${DIRECTORY}/crowdsec/appsec.yml:/etc/crowdsec/acquis.d/appsec.yml:ro
      - ${DIRECTORY}/logs:/var/log/traefik:ro
      - ${DIRECTORY}/crowdsec/traefik-logs.yml:/etc/crowdsec/acquis.d/traefik-logs.yml:ro
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/crowdsec.webp
    networks:
      - proxy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  logrotate:
    image: samuelrunggaldier/logrotate:1.2.3@sha256:411c0afc326281bfc7e7d4b8f54f3ca9cc4bb1a50f1c641778d7f212d84981f2
    restart: always
    deploy:
      resources:
        limits:
          memory: '128M'
          cpus: '0.25'
    environment:
      TZ: Europe/Berlin
      LOGS_PATH: '/logs/*.log'
      TRIGGER_INTERVAL: daily
      MAX_SIZE: 50M
      MAX_BACKUPS: 7
      MAX_AGE: 30
      DELAYCOMPRESS: 'true'
    volumes:
      - ${DIRECTORY}/logs:/logs

networks:
  proxy:
    external: true

volumes:
  crowdsec-data:

# Example EXTRA_FLAGS:
# --entrypoints.https.http.tls.domains[0].main=*.unjx.de
# --providers.docker.defaultRule="Host(`{{ lower (first (splitList \"-\" .Name) | default .Name) }}.unjx.de`)"
