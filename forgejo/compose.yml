services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1@sha256:fcd19ff4ebc85fb098a67e8e1d0d5a84d07dd6e8a23edcfdfd5b71a6178953be
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '2G'
          cpus: '2.0'
    depends_on:
      db:
        condition: service_healthy
    environment:
      FORGEJO__service__ENABLE_INTERNAL_SIGNIN: ${ENABLE_INTERNAL_SIGNIN:-true}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: db
      FORGEJO__database__USER: user
      FORGEJO__database__PASSWD: password
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16}
    volumes:
      - ${DIRECTORY}/data:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/forgejo.webp
      - traefik.enable=true
      - traefik.http.routers.forgejo.entrypoints=https
      - traefik.http.routers.forgejo.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.routers.forgejo.tls.certresolver=hetzner
      - traefik.http.routers.forgejo.service=forgejo
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
    expose:
      - 3000
    ports:
      - '30:22'
    networks:
      - proxy
      - net

  db:
    image: postgres:17.11@sha256:5bf4cdb7aa4b9241bcebf00f15933b1939c928d00f03a36395fbab28e02b8b31
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
    labels:
      - backup.target=${BACKUP_TARGET:-forgejo}
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postgresql.webp
    expose:
      - 5432
    networks:
      - net

networks:
  proxy:
    external: true
  net:
    external: false

volumes:
  db: {}
