services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.3@sha256:7c4e1db440be7b2ca685b49d0d7864cdd78e92431f531bf7893659def8200fc5
    restart: always
    deploy:
      resources:
        limits:
          memory: '2G'
          cpus: '2.0'
    depends_on:
      db:
        condition: service_healthy
    environment:
      FORGEJO__service__ENABLE_INTERNAL_SIGNIN: false
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: db
      FORGEJO__database__USER: user
      FORGEJO__database__PASSWD: password
      FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.18.0.0/16}
    volumes:
      - ${DIRECTORY}/data:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/forgejo.webp
      - traefik.enable=true
      - traefik.http.routers.forgejo.entrypoints=https
      - traefik.http.routers.forgejo.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.forgejo.tls=true
      - traefik.http.routers.forgejo.tls.certresolver=hetzner
      - traefik.http.routers.forgejo.service=forgejo
      - traefik.http.services.forgejo.loadbalancer.server.port=3000
    expose:
      - 3000
    ports:
      - '30:22'
    networks:
      - proxy
      - net

  db:
    image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    restart: always
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
    labels:
      - backup.target=${BACKUP_TARGET:-forgejo}
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postgresql.webp
    expose:
      - 5432
    networks:
      - net

networks:
  proxy:
    external: true
  net:
    external: false

volumes:
  data: {}
  db: {}
