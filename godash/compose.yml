services:
  godash:
    image: ghcr.io/flohoss/godash:v1.8.1@sha256:60be2b12cad38b097e32a1034d7c026ae5f664c1e63f12622704828c20d7d9cd
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ${DIRECTORY}:/app/config
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/homer.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8156}:8156'
