services:
  godash:
    image: ghcr.io/flohoss/godash:v1.6.3@sha256:b124404f36d94d7a3721d7cb9008404e9f54155b956abf4c16125a0c5ba8a8eb
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ${DIRECTORY}:/app/config
    ports:
      - ${PORT:-8156}:8156
