services:
  godash:
    image: ghcr.io/flohoss/godash:v1.7.0@sha256:0da2fe5f4e14e728245ca20f0742e75bbce519b90c2661755e70de0931fb83c8
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ${DIRECTORY}:/app/config
    ports:
      - ${PORT:-8156}:8156
