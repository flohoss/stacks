services:
  godash:
    image: ghcr.io/flohoss/godash:v1.8.0@sha256:e95a5e82f733fb3ece76d719a752648a1a506bb7e995eb5cc21fef069f1a19c8
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ${DIRECTORY}:/app/config
    labels:
      - net.unraid.docker.managed=composeman
    ports:
      - '${HOST_BINDING:-127.0.0.1:8156}:8156'
