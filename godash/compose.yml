services:
  godash:
    image: ghcr.io/flohoss/godash:v1.7.2@sha256:b78cbe78cfa27c066df7dc822bee8c08062d352fac08b34a8b0386a49a1f378a
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ${DIRECTORY}:/app/config
    ports:
      - ${PORT:-8156}:8156
