services:
  godash:
    image: ghcr.io/flohoss/godash:v1.7.1@sha256:9c42f414d31a48bd2d768b6b115dcae1bcf9010e3656ef25afd04613dcf9e5dd
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ${DIRECTORY}:/app/config
    ports:
      - ${PORT:-8156}:8156
