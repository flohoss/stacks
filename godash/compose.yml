services:
  godash:
    image: ghcr.io/flohoss/godash:v1.6.1@sha256:0021f19ea8daa1f7bf709008aae19c86784e8afd2371be6784c3e52c6c7e40a2
    restart: always
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ${DIRECTORY}:/app/config
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/homebox.webp
      - traefik.enable=true
      - traefik.http.routers.godash.entrypoints=https
      - traefik.http.routers.godash.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.godash.tls=true
      - traefik.http.routers.godash.tls.certresolver=hetzner
    expose:
      - 8156
    networks:
      - proxy

networks:
  proxy:
    external: true
