services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      TZ: Europe/Berlin
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    volumes:
      - ${DIRECTORY}/audiobooks:/audiobooks
      - ${DIRECTORY}/podcasts:/podcasts
      - ${DIRECTORY}/config:/config
      - ${DIRECTORY}/metadata:/metadata
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/audiobookshelf.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8080}:80'
