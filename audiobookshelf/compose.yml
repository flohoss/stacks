services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      TZ: Europe/Berlin
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    volumes:
      - ${DIRECTORY}/audiobooks:/audiobooks
      - ${DIRECTORY}/podcasts:/podcasts
      - ${DIRECTORY}/config:/config
      - ${DIRECTORY}/metadata:/metadata
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:8080}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/audiobookshelf.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8080}:80'
