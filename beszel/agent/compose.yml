services:
  beszel-agent:
    image: henrygd/beszel-agent:0.21.2@sha256:343254226ae57a5cc6f8c23c755b1464730aba2abc7043116a2e222711ec6e1a
    restart: always
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    logging:
      options:
        max-size: 5m
        max-file: '2'
    extra_hosts:
      - ${EXTRA_HOSTS:-localhost:127.0.0.1}
    read_only: true
    cap_drop:
      - 'ALL'
    security_opt:
      - no-new-privileges:true
    network_mode: host
    environment:
      LISTEN: '${HOST_BINDING:-127.0.0.1:45876}'
      KEY: ${KEY}
      TOKEN: ${TOKEN}
      HUB_URL: ${HUB_URL}
      DISCONNECT_RETRY_INTERVAL: 15s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agentdata:/var/lib/beszel-agent
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/beszel.webp

volumes:
  agentdata: {}
