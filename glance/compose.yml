services:
  glance:
    image: glanceapp/glance:v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    read_only: true
    user: '1000:1000'
    volumes:
      - ${DIRECTORY}:/app/config:ro
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:8080}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/glance.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8080}:8080'
