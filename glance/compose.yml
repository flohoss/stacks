services:
  glance:
    image: glanceapp/glance:v0.8.7@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    read_only: true
    user: '1000:1000'
    volumes:
      - ${DIRECTORY}:/app/config:ro
    ports:
      - '${HOST_BINDING:-127.0.0.1:8080}:8080'
