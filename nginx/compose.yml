services:
  nginx:
    image: nginx/nginx-unprivileged:1.31.9@sha256:4ac6145e433b1adc0880714fe3402680f5e599f1a264148253d6a94a4c000776
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '128M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/html:/usr/share/nginx/html:ro
      - ${DIRECTORY}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:8080}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/nginx.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8080}:8080'
