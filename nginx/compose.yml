services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.31.7@sha256:09b0d3eda2aa592d2487f284519419015cab010d7df16cd0fe224b585fc60eb6
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '128M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/html:/usr/share/nginx/html:ro
      - ${DIRECTORY}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:8080}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/memos.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8080}:8080'
