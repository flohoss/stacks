services:
  mittagskarte:
    image: ghcr.io/flohoss/mittagskarte:v2.5.2@sha256:18ca9ea68369009c335dde1fda611d7e461a2e11b62c83f1c6a898fc09cdefdc
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '512M'
          cpus: '2.0'
    environment:
      IMPRINT_EMAIL: ${IMPRINT_EMAIL}
      APP_URL: https://${DOMAIN}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      SNAPOTTER_URL: ${SNAPOTTER_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_SECRET: ${TELEGRAM_SECRET}
      BUYMEACOFFEE_URL: ${BUYMEACOFFEE_URL}
    volumes:
      - ${DIRECTORY}:/app/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:8090}
    ports:
      - '${HOST_BINDING:-127.0.0.1:8090}:8090'
