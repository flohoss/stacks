services:
  mittagskarte:
    image: ghcr.io/flohoss/mittagskarte:v2.1.1@sha256:ca9b20a87863a9bb85973e4cccd9cbfcdfde2850c7f9b7a0a30a9aa69988faed
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '512m'
    environment:
      - IMPRINT_EMAIL=${IMPRINT_EMAIL}
      - APP_URL=https://${DOMAIN}
      - SMTP_SENDER_ADDRESS=${SMTP_SENDER_ADDRESS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
    volumes:
      - ${DIRECTORY}:/app/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/mittagskarte.webp
      - traefik.enable=true
      - traefik.http.routers.mittagskarte.entrypoints=https
      - traefik.http.routers.mittagskarte.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.mittagskarte.tls=true
      - traefik.http.routers.mittagskarte.tls.certresolver=desec
    expose:
      - 8090
    networks:
      - proxy
      - net

  snapotter:
    image: snapotter/snapotter:2.2.0@sha256:2e11b4fa9138fa93e0fdfde5da3a2d042eebcfa81dd51286488872a3eb8086c8
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '1g'
    environment:
      TZ: Europe/Berlin
      AUTH_ENABLED: false
      LOG_LEVEL: warn
      DEFAULT_THEME: dark
    volumes:
      - snapotter:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/snapotter.webp
    ports:
      - '1349:1349'
    networks:
      - net

networks:
  proxy:
    external: true
  net:
    external: false

volumes:
  snapotter: {}
