services:
  mittagskarte:
    image: ghcr.io/flohoss/mittagskarte:v2.1.4@sha256:a0da6f108cba10a5a9b5f267bc1ff477ded728d4563c2ca4acce1270a38b9206
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '512m'
    environment:
      - IMPRINT_EMAIL=${IMPRINT_EMAIL}
      - APP_URL=https://${DOMAIN}
      - SMTP_SENDER_ADDRESS=${SMTP_SENDER_ADDRESS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - SNAPOTTER_URL=${SNAPOTTER_URL}
    volumes:
      - ${DIRECTORY}:/app/data
    ports:
      - ${PORT:-8090}:8090
