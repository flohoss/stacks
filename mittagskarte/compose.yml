services:
  mittagskarte:
    image: ghcr.io/flohoss/mittagskarte:v2.1.5@sha256:8eb9318cc10ee97ef85e7fd12c5e2a8b56067e4538e30f3c9f7be5d3bce884d7
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: '512m'
    environment:
      - IMPRINT_EMAIL=${IMPRINT_EMAIL}
      - APP_URL=https://${DOMAIN}
      - SMTP_SENDER_ADDRESS=${SMTP_SENDER_ADDRESS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - SNAPOTTER_URL=${SNAPOTTER_URL}
    volumes:
      - ${DIRECTORY}:/app/data
    labels:
      - net.unraid.docker.managed=composeman
    ports:
      - '${HOST_BINDING:-127.0.0.1:8090}:8090'
