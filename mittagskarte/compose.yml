services:
  mittagskarte:
    image: ghcr.io/flohoss/mittagskarte:v2.4.3@sha256:2f022b9bb3a9f6d42f58b7b875b2ed4e5418d7c8dacefaec6920a3c7d79f73d3
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '512M'
          cpus: '2.0'
    environment:
      IMPRINT_EMAIL: ${IMPRINT_EMAIL}
      APP_URL: https://${DOMAIN}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      SNAPOTTER_URL: ${SNAPOTTER_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_SECRET: ${TELEGRAM_SECRET}
    volumes:
      - ${DIRECTORY}:/app/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:8090}
    ports:
      - '${HOST_BINDING:-127.0.0.1:8090}:8090'
