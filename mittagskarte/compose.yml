services:
  mittagskarte:
    image: ghcr.io/flohoss/mittagskarte:v2.2.0@sha256:d5bcdb82853d9838588907a1feeaf279bad614b59f2726c7c70ea4a7d10f60a6
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '512M'
          cpus: '2.0'
    environment:
      IMPRINT_EMAIL: ${IMPRINT_EMAIL}
      APP_URL: https://${DOMAIN}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      SNAPOTTER_URL: ${SNAPOTTER_URL}
    volumes:
      - ${DIRECTORY}:/app/data
    labels:
      - net.unraid.docker.managed=composeman
    ports:
      - '${HOST_BINDING:-127.0.0.1:8090}:8090'
