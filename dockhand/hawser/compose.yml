services:
  hawser:
    image: ghcr.io/finsys/hawser:0.2.54@sha256:a4eb798003d50d0247833b7ca67fb8f185723b962c0dfee80b1297bc5574e778
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      options:
        max-size: 5m
        max-file: '2'
    environment:
      TLS_CERT: /certs/server.crt
      TLS_KEY: /certs/server.key
      TOKEN: ${TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DIRECTORY:-.}/stacks:/data/stacks
      - ${DIRECTORY:-.}/certs:/certs
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/hawser.webp
    ports:
      - '${HOST_BINDING:-localhost:2376}:2376'
