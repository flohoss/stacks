services:
  hawser:
    image: ghcr.io/finsys/hawser:0.2.53@sha256:bbeebc96c2d03b2721c6bfc88e1b250eb852c66ed3914335a6fe8ced4218f059
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      options:
        max-size: 5m
        max-file: '2'
    environment:
      TLS_CERT: /certs/server.crt
      TLS_KEY: /certs/server.key
      TOKEN: ${TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DIRECTORY:-.}/stacks:/data/stacks
      - ${DIRECTORY:-.}/certs:/certs
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/hawser.webp
    ports:
      - '${HOST_BINDING:-localhost:2376}:2376'
