services:
  dockhand:
    image: fnsys/dockhand:v1.0.57@sha256:4fd64d32728c99e5caf39b952a17d85448ee0b8ae76e0961f719ba2e19013988
    restart: always
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    logging:
      options:
        max-size: 5m
        max-file: '2'
    volumes:
      - ${DIRECTORY:-./data}:/app/data
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - DISABLE_LOCAL_LOGIN=${DISABLE_LOCAL_LOGIN:-false}
      - DISABLE_WHATS_NEW=${DISABLE_WHATS_NEW:-true}
      - TRUST_FORWARDED_HEADERS=${TRUST_FORWARDED_HEADERS:-true}
      - DISABLE_METRICS=${DISABLE_METRICS:-true}
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:3000}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/dockhand.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:3000}:3000'
