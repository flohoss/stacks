services:
  immich:
    image: ghcr.io/immich-app/immich-server:v3.0.3@sha256:c716dc20f957aafd89fa9d284a2ec63e25c9e2d8d8e87c6197d540a3dce237db
    restart: always
    extra_hosts:
      - '${EXTRA_HOSTS:-localhost:127.0.0.1}'
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      DB_PASSWORD: password
      DB_USERNAME: user
      DB_DATABASE_NAME: db
      DB_HOSTNAME: db
      REDIS_HOSTNAME: redis
    volumes:
      - ${DATA_DIR}:/data
      - ${OLD_DATA_DIR}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/immich.webp
      - traefik.enable=true
      - traefik.http.routers.immich.entrypoints=https
      - traefik.http.routers.immich.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.immich.tls=true
      - traefik.http.routers.immich.tls.certresolver=desec
    expose:
      - 2283
    networks:
      - proxy
      - net
    healthcheck:
      disable: false

  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.3@sha256:d76fe88b69282c09a97eac4f82dafa82cfd77bce274bc742591cde974f87dacb
    restart: always
    environment:
      TZ: Europe/Berlin
      DB_PASSWORD: password
      DB_USERNAME: user
      DB_DATABASE_NAME: db
      DB_HOSTNAME: db
      REDIS_HOSTNAME: redis
    volumes:
      - cache:/cache
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/immich.webp
    networks:
      - net
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping || exit 1']
    volumes:
      - redis:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/redis.webp
    networks:
      - net

  db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: always
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: db
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - db:/var/lib/postgresql/data
    labels:
      - backup.target=${BACKUP_TARGET:-immich}
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postgresql.webp
    expose:
      - 5432
    networks:
      - net

networks:
  proxy:
    external: true
  net:
    external: false

volumes:
  cache: {}
  db: {}
  redis: {}
