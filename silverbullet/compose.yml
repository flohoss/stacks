services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.9.0@sha256:82e76a800920370d83e2f50c6946d3c420954b0bd417dbb96f7911513fa05620
    restart: always
    environment:
      SB_USER: admin:password
    volumes:
      - ${DIRECTORY}:/space
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/silverbullet.webp
      - traefik.enable=true
      - traefik.http.routers.silverbullet.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.silverbullet.entrypoints=https
    expose:
      - 3000
    networks:
      - proxy

networks:
  proxy:
    external: true
