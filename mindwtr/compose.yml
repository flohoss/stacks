services:
  cloud:
    image: ghcr.io/dongdongbh/mindwtr-cloud:1.3.1@sha256:b84e14e80023ed75df16d8f8f82b789dc767a6476483d0d5201ed44bbe417bdb
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '512m'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8787/health >/dev/null || exit 1']
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      TZ: Europe/Berlin
      MINDWTR_CLOUD_AUTH_TOKENS: ${TOKENS}
      MINDWTR_CLOUD_CORS_ORIGIN: https://${DOMAIN}
    volumes:
      - ${DIRECTORY}:/app/cloud_data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/mindwtr.webp
      - traefik.enable=true
      - traefik.http.routers.mindwtr-api.entrypoints=https
      - traefik.http.routers.mindwtr-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/v1`)
      - traefik.http.routers.mindwtr-api.tls=true
      - traefik.http.routers.mindwtr-api.tls.certresolver=hetzner
      - traefik.http.routers.mindwtr-api.service=mindwtr-api
      - traefik.http.routers.mindwtr-api.priority=100
      - traefik.http.services.mindwtr-api.loadbalancer.server.port=8787
    expose:
      - 8787
    networks:
      - proxy

  app:
    image: ghcr.io/dongdongbh/mindwtr-app:1.3.1@sha256:f6993a18e5f547a4df3ec941f94e10a74cf1287598ad7b21dca4a8478c950998
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '512m'
    depends_on:
      cloud:
        condition: service_healthy
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/mindwtr.webp
      - traefik.enable=true
      - traefik.http.routers.mindwtr.entrypoints=https
      - traefik.http.routers.mindwtr.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.mindwtr.tls=true
      - traefik.http.routers.mindwtr.tls.certresolver=hetzner
      - traefik.http.routers.mindwtr.service=mindwtr
      - traefik.http.routers.mindwtr.priority=1
      - traefik.http.services.mindwtr.loadbalancer.server.port=5173
    expose:
      - 5173
    networks:
      - proxy

networks:
  proxy:
    external: true
