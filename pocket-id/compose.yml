services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.18.0-distroless@sha256:138d106737498f6c20d0bec854b872bc77ec520d7a9b54502444a260a49c41cb
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    read_only: true
    user: '1000:1000'
    environment:
      APP_URL: https://${DOMAIN}
      TRUST_PROXY: true
      ANALYTICS_DISABLED: true
      VERSION_CHECK_DISABLED: true
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${DIRECTORY}:/app/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/pocket-id.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:1411}:1411'
