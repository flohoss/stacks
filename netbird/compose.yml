services:
  traefik:
    image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
    container_name: netbird-traefik
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.10
    command:
      - '--api=true'
      - '--entrypoints.apiint.address=127.0.0.1:8081'
      - '--log.level=INFO'
      - '--accesslog=true'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.allowACMEByPass=true'
      - '--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0'
      - '--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0'
      - '--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--certificatesresolvers.letsencrypt.acme.email=${PRIVATE_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--certificatesresolvers.letsencrypt.acme.tlschallenge=true'
      - '--serverstransport.forwardingtimeouts.responseheadertimeout=0s'
      - '--serverstransport.forwardingtimeouts.idleconntimeout=0s'
      - '--entrypoints.web.http.aliasHeadersStrategy=delete'
      - '--entrypoints.websecure.http.aliasHeadersStrategy=delete'
      - '--entrypoints.apiint.http.aliasHeadersStrategy=delete'
      - '--experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin'
      - '--experimental.plugins.bouncer.version=v1.7.1'
      - '--providers.file.filename=/etc/traefik/dynamic.yaml'
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - letsencrypt:/letsencrypt
      - traefik-plugins:/plugins-storage
      - ./traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 200
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    healthcheck:
      test: ['CMD-SHELL', "wget -qO- http://127.0.0.1:8081/api/http/routers/netbird-dashboard@file | grep -q netbird-dashboard-crowdsec && wget -qO- http://127.0.0.1:8081/api/http/routers/netbird-dashboard-api@file | grep -q netbird-dashboard-crowdsec"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

  dashboard:
    image: netbirdio/dashboard:v2.95.0@sha256:3d6adfee19dd8d34d795af51daee69d27d2081d2076a5a304cfdd14acc67d6f4
    container_name: netbird-dashboard
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.11
    env_file:
      - ./dashboard.env
    tmpfs:
      - /tmp
      - /var/lib/nginx/tmp
      - /var/lib/nginx/logs
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

  netbird-server:
    image: netbirdio/netbird-server:0.81.4@sha256:d456702621ab1325313f711fc0264b3990a57daa872245acbe4469bc3e69d698
    container_name: netbird-server
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.12
    ports:
      - '3478:3478/udp'
    volumes:
      - ./data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml:ro
    command: ['--config', '/etc/netbird/config.yaml']
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

  proxy:
    image: netbirdio/reverse-proxy:0.81.4@sha256:ad7f25b3cd55b77489d416d466e853cab3f4b66c82bf265d60fdd52f265484aa
    container_name: netbird-proxy
    ports:
      - 51820:51820/udp
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.13
    depends_on:
      netbird-server:
        condition: service_started
      crowdsec:
        condition: service_healthy
    env_file:
      - ./proxy.env
    volumes:
      - certs:/certs
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 200
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: netbird-crowdsec
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.14
    environment:
      COLLECTIONS: crowdsecurity/linux crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      BOUNCER_KEY_netbird_dashboard: ${CROWDSEC_DASHBOARD_BOUNCER_KEY}
    volumes:
      - ./crowdsec/acquis.d/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      - crowdsec:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    healthcheck:
      test: ['CMD-SHELL', "cscli lapi status >/dev/null 2>&1 && bash -c '</dev/tcp/127.0.0.1/7422'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

volumes:
  letsencrypt:
  traefik-plugins:
  certs:
  crowdsec:
  crowdsec-config:

networks:
  netbird:
    name: netbird
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
