services:
  traefik:
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    container_name: netbird-traefik
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.10
    command:
      - '--api=true'
      - '--entrypoints.apiint.address=127.0.0.1:8081'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.allowACMEByPass=true'
      - '--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0'
      - '--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0'
      - '--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--certificatesresolvers.letsencrypt.acme.email=${PRIVATE_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--certificatesresolvers.letsencrypt.acme.tlschallenge=true'
      - '--serverstransport.forwardingtimeouts.responseheadertimeout=0s'
      - '--serverstransport.forwardingtimeouts.idleconntimeout=0s'
      - '--entrypoints.web.http.aliasHeadersStrategy=delete'
      - '--entrypoints.websecure.http.aliasHeadersStrategy=delete'
      - '--entrypoints.apiint.http.aliasHeadersStrategy=delete'
      - '--experimental.plugins.bouncer.modulename=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin'
      - '--experimental.plugins.bouncer.version=v1.8.1'
      - '--providers.file.filename=/etc/traefik/dynamic.yaml'
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - letsencrypt:/letsencrypt
      - ./traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8081/api/http/routers/netbird-dashboard@file | grep -q netbird-dashboard-crowdsec && wget -qO- http://127.0.0.1:8081/api/http/routers/netbird-dashboard-api@file | grep -q netbird-dashboard-crowdsec',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

  dashboard:
    image: netbirdio/dashboard:v2.97.0@sha256:203b2dc90dc20d3fd45729caac7c922deb399586a68202e0a35be099720bac7d
    container_name: netbird-dashboard
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.11
    env_file:
      - ./dashboard.env
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

  netbird-server:
    image: netbirdio/netbird-server:0.83.1@sha256:f6acc1a6dcb48d10b867ec7e6916c62ef5c8dc2bb198aec9cc637b2dd26c06c9
    container_name: netbird-server
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.12
    env_file:
      - ./server.env
    ports:
      - '3478:3478/udp'
    volumes:
      - ./data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml
    command: ['--config', '/etc/netbird/config.yaml']
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

  proxy:
    image: netbirdio/reverse-proxy:0.83.1@sha256:7c8e11d39dfd88bd9f5a9e281b802b7e5772dc11869f53be81685283800816c5
    container_name: netbird-proxy
    ports:
      - 51820:51820/udp
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.13
    depends_on:
      netbird-server:
        condition: service_started
      crowdsec:
        condition: service_healthy
    env_file:
      - ./proxy.env
    volumes:
      - certs:/certs
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    container_name: netbird-crowdsec
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.14
    environment:
      COLLECTIONS: crowdsecurity/linux crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      BOUNCER_KEY_netbird_dashboard: ${CROWDSEC_DASHBOARD_BOUNCER_KEY}
    volumes:
      - ./crowdsec/acquis.d/appsec.yaml:/etc/crowdsec/acquis.d/appsec.yaml:ro
      - crowdsec:/var/lib/crowdsec/data
    healthcheck:
      test: ['CMD-SHELL', "cscli lapi status >/dev/null 2>&1 && bash -c '</dev/tcp/127.0.0.1/7422'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '500m'
        max-file: '2'

volumes:
  letsencrypt:
  certs:
  crowdsec:

networks:
  netbird:
    name: netbird
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
