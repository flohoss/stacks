services:
  gocron:
    image: ghcr.io/flohoss/gocron:v0.14.2@sha256:16663a8e5e9fa1b16d5e419e341e40260b8eb68fe0e707f1c343e6fe8e284b01
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    hostname: gobackup
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    volumes:
      - ${DIRECTORY}/config:/app/config/
      - ${DIRECTORY}/.resticpwd:/secrets/.resticpwd
      - ${DIRECTORY}/.rclone.conf:/root/.config/rclone/rclone.conf
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_MOUNT}
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:8156}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/gocron.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8156}:8156'
