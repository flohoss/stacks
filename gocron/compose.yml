services:
  gocron:
    image: ghcr.io/flohoss/gocron:v0.14.3@sha256:3297a6ebb4fcfe7ee09173a5a6dbb198a8a53624dc1d274c07b51635f8204172
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    hostname: gobackup
    volumes:
      - ${DIRECTORY}/config:/app/config/
      - ${DIRECTORY}/.resticpwd:/secrets/.resticpwd
      - ${DIRECTORY}/.rclone.conf:/root/.config/rclone/rclone.conf
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_MOUNT}
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:8156}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/gocron.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8156}:8156'
