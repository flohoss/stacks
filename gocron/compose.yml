services:
  gocron:
    image: ghcr.io/flohoss/gocron:v0.9.11@sha256:47a7af0e744a26d1c096a86212c2990723eff2a0ca82b43349aabf26ee271af2
    restart: always
    hostname: gobackup
    extra_hosts:
      - '${EXTRA_HOSTS:-localhost:127.0.0.1}'
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    volumes:
      - ${DIRECTORY}/config:/app/config/
      - ${DIRECTORY}/.resticpwd:/secrets/.resticpwd
      - ${DIRECTORY}/.rclone.conf:/root/.config/rclone/rclone.conf
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_MOUNT}
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/restic.webp
    ports:
      - 8156:8156
