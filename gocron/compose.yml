services:
  gocron:
    image: ghcr.io/flohoss/gocron:v0.13.3@sha256:50d3665bf7a62105fba2d9baf8ad622c76aaece40848d4626c6236291c0a8021
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    hostname: gobackup
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    volumes:
      - ${DIRECTORY}/config:/app/config/
      - ${DIRECTORY}/.resticpwd:/secrets/.resticpwd
      - ${DIRECTORY}/.rclone.conf:/root/.config/rclone/rclone.conf
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_MOUNT}
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/restic.webp
    ports:
      - ${PORT:-8156}:8156
