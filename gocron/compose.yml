services:
  gocron:
    image: ghcr.io/flohoss/gocron:v0.13.1@sha256:3dfde5d35de22934738787e6d9eceff3cc030403c3a6b248f4b857e5ee9683d9
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    hostname: gobackup
    extra_hosts:
      - '${EXTRA_HOSTS:-localhost:127.0.0.1}'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    volumes:
      - ${DIRECTORY}/config:/app/config/
      - ${DIRECTORY}/.resticpwd:/secrets/.resticpwd
      - ${DIRECTORY}/.rclone.conf:/root/.config/rclone/rclone.conf
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_MOUNT}
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/restic.webp
    ports:
      - 8156:8156
