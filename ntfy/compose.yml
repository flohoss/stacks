services:
  ntfy:
    image: binwiederhier/ntfy:v2.31.0@sha256:803b2aaeb94df76c8b32ecd91039dc80b0fddb7041dcaf082b33bcdfd4ba39ad
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '128M'
          cpus: '0.25'
    command:
      - serve
    environment:
      TZ: Europe/Berlin
    volumes:
      - ${DIRECTORY}/cache:/var/cache/ntfy
      - ${DIRECTORY}/ntfy:/etc/ntfy
    ports:
      - ${PORT:-80}:80
