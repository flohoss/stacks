services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.3@sha256:874299b207a9815e7a0cf551b3a094241db7604fa2d274bbd86f569154b6ea51
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '128M'
          cpus: '0.25'
    command:
      - 'serve'
    environment:
      TZ: Europe/Berlin
    volumes:
      - ${DIRECTORY}/cache:/var/cache/ntfy
      - ${DIRECTORY}/ntfy:/etc/ntfy
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:80}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/ntfy.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:80}:80'
