services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '128M'
          cpus: '0.25'
    read_only: true
    tmpfs:
      - /run:rw,mode=1777
      - /tmp
    environment:
      CONTAINERS: 1
      INFO: 1
      IMAGES: 1
      VERSION: 1
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/docker.webp
    ports:
      - '${PROXY_BIND:-127.0.0.1:2375}:2375'
