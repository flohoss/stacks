services:
  memos:
    image: neosmemo/memos:26.10.0@sha256:fbc6ef8e9e0b377377f0d71d426d6192a9a0f08a8e3e35bec3557a43f4399260
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      MEMOS_INSTANCE_URL: https://${DOMAIN}
    volumes:
      - ${DIRECTORY}:/var/opt/memos
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/memos.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:5230}:5230'
