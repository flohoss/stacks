services:
  memos:
    image: neosmemo/memos:26.11.1@sha256:5dcd6e6b973a55b964f2fe2ccdaa33319463ab448a23404ebb5d2acbd19299ba
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      TZ: Europe/Berlin
      MEMOS_INSTANCE_URL: https://${DOMAIN}
    volumes:
      - ${DIRECTORY}:/var/opt/memos
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/memos.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:5230}:5230'
