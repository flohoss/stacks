services:
  memos:
    image: neosmemo/memos:26.11.2@sha256:3c7bd779510403350465ecabb7e6fbc0887206f9d55b8decf51a205613fa5616
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    environment:
      TZ: Europe/Berlin
      MEMOS_INSTANCE_URL: https://${DOMAIN}
    volumes:
      - ${DIRECTORY}:/var/opt/memos
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/memos.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:5230}:5230'
