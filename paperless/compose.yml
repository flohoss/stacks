services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.1@sha256:1a08d8dfc2b51a08de09652dd86ad4d0c611c362382f944533ad38b73125fbc4
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '4G'
          cpus: '4.0'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: db
      PAPERLESS_DBUSER: user
      PAPERLESS_DBPASS: password
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_OCR_LANGUAGES: 'eng deu'
      PAPERLESS_URL: https://${DOMAIN}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      PAPERLESS_ALLOWED_HOSTS: ${BASE_DOMAIN}
      PAPERLESS_USE_X_FORWARD_HOST: true
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
      PAPERLESS_APPS: 'allauth.socialaccount.providers.openid_connect'
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '${SOCIALACCOUNT_PROVIDERS}'
      PAPERLESS_DISABLE_REGULAR_LOGIN: ${DISABLE_REGULAR_LOGIN}
      PAPERLESS_SECRET_KEY: ${SECRET_KEY}
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: true
      PAPERLESS_TRUSTED_PROXIES: ${TRUSTED_PROXIES}
    volumes:
      - ${DIRECTORY}/data:/usr/src/paperless/data
      - ${DIRECTORY}/export:/usr/src/paperless/export
      - ${DIRECTORY}/media:/usr/src/paperless/media
      - ${DIRECTORY}/consume:/usr/src/paperless/consume
    labels:
      - backup.target=${BACKUP_TARGET:-paperless}
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/paperless-ngx.webp
      - traefik.enable=true
      - traefik.http.routers.paperless.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.paperless.entrypoints=https
      - traefik.http.routers.paperless.tls=true
      - traefik.http.routers.paperless.tls.certresolver=hetzner
    expose:
      - 8000
    networks:
      - proxy
      - net

  db:
    image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postgresql.webp
    expose:
      - 5432
    networks:
      - net

  redis:
    image: redis:8.10.3@sha256:de1068af6f552240dfab67bcc9bfef99bfc60f776bb4580ef077ea4c8c97e848
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping || exit 1']
    volumes:
      - redis:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/redis.webp
    expose:
      - 6379
    networks:
      - net

networks:
  proxy:
    external: true
  net:
    external: false

volumes:
  db: {}
  redis: {}
