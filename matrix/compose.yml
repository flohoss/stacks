services:
  matrix:
    image: matrixdotorg/synapse:v1.164.0@sha256:621463e2263551c3b2f13ebb8cc96c3de968855d5adbf4b0852c42a9bb42deea
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '2G'
          cpus: '2.0'
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${BASE_DOMAIN}
      SYNAPSE_REPORT_STATS: no
      POSTGRES_PASSWORD: password
      UID: 991
      GID: 991
    volumes:
      - ${DIRECTORY}:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/matrix.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8008}:8008'
    networks:
      - net

  db:
    image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
    labels:
      - backup.target=${BACKUP_TARGET:-matrix}
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postgresql.webp
    expose:
      - 5432
    networks:
      - net

  signal:
    image: dock.mau.dev/mautrix/signal:v26.10@sha256:39afa721aa69472b2e91c75bd7d81a739e47f7e480fc0ff5ac8247af28eb2d0a
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/signal:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/signal.webp
    networks:
      - net

  telegram:
    image: dock.mau.dev/mautrix/telegram:v26.10@sha256:ed3f3b39289fae425a875311d8875729271c24f88ba03209bd1bfbaf31e6c78f
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/telegram:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/telegram.webp
    networks:
      - net

  whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:v26.10@sha256:c807054cb015d0f5c90d20d85aac216d062b4a6f4ae834b931fd5e7f03e27391
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/whatsapp:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/whatsapp.webp
    networks:
      - net

  meta:
    image: dock.mau.dev/mautrix/meta:v26.10@sha256:22bfa54084b6855188f5146b325ee007a298443a9617caead06cc5fc0ba0d687
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/meta:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/meta.webp
    networks:
      - net

networks:
  net:
    external: false

volumes:
  db: {}
