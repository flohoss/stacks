services:
  matrix:
    image: matrixdotorg/synapse:v1.157.0@sha256:53a686c52cdfca5fdb0adff5ef10b276b1d0971931b09815a9eb6b48d7188a1a
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${BASE_DOMAIN}
      SYNAPSE_REPORT_STATS: no
      POSTGRES_PASSWORD: password
      UID: 991
      GID: 991
    volumes:
      - ${DIRECTORY}:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/synapse.webp
      - traefik.enable=true
      - traefik.http.routers.matrix.entrypoints=https
      - traefik.http.routers.matrix.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.matrix.tls=true
      - traefik.http.routers.matrix.tls.certresolver=desec
      - traefik.http.routers.matrix.priority=1
      - traefik.http.routers.matrix.service=matrix
      - traefik.http.services.matrix.loadbalancer.server.port=8008
    networks:
      - proxy
      - net

  matrix-wellknown:
    image: nginxinc/nginx-unprivileged:1.31.3@sha256:49c9bef1797e11117a7f490fd00f282e377ac402fec472c72636f90cdbf72e10
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    environment:
      SYNAPSE_DOMAIN: ${DOMAIN}
    command: |
      /bin/sh -c "
      mkdir -p /tmp/www/.well-known/matrix
      echo '{\"m.homeserver\": {\"base_url\": \"https://${DOMAIN}\"}}' > /tmp/www/.well-known/matrix/client
      echo '{\"m.server\": \"${DOMAIN}:443\"}' > /tmp/www/.well-known/matrix/server
      cat > /tmp/nginx.conf << 'EOF'
      pid /tmp/nginx.pid;
      events { worker_connections 1024; }

      http {
        server {
          listen 8080;
          server_name _;
          location /.well-known/matrix/ {
            root /tmp/www;
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            try_files \$$uri =404;
          }
        }
      }
      EOF
      nginx -c /tmp/nginx.conf -g 'daemon off;'
      "
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}/.well-known/matrix/server
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/nginx.webp
      - traefik.enable=true
      - traefik.http.routers.matrix-wellknown.entrypoints=https
      - traefik.http.routers.matrix-wellknown.rule=Host(`${DOMAIN}`) && PathPrefix(`/.well-known/matrix/`)
      - traefik.http.routers.matrix-wellknown.tls=true
      - traefik.http.routers.matrix-wellknown.tls.certresolver=desec
      - traefik.http.routers.matrix-wellknown.priority=100
    expose:
      - 8080
    networks:
      - proxy

  db:
    image: postgres:17.10@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
    labels:
      - backup.target=${BACKUP_TARGET:-matrix}
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postgresql.webp
    expose:
      - 5432
    networks:
      - net

  signal:
    image: dock.mau.dev/mautrix/signal:v26.07@sha256:e02b5c140346f2ecfa9a4a029cd7c0311dcb6d114d5aedfaaa88897ede9a9ee8
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    volumes:
      - ${DIRECTORY}/signal:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/signal.webp
    networks:
      - net

  telegram:
    image: dock.mau.dev/mautrix/telegram:v26.07@sha256:5a8c0e02f6333c7610ca429a2d643f15ea02fcf52e95647af6e76d5d5cbc78f3
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    volumes:
      - ${DIRECTORY}/telegram:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/telegram.webp
    networks:
      - net

  whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:v26.07@sha256:716cb6e6b59b1710bde0b7740e295aa889fef6494a8efcd4ad02ea1965293eaf
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    volumes:
      - ${DIRECTORY}/whatsapp:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/whatsapp.webp
    networks:
      - net

  meta:
    image: dock.mau.dev/mautrix/meta:v26.07@sha256:c65eb7f10a3880933490972bed574678874d780df70458a5ab0568157f9cc15c
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    volumes:
      - ${DIRECTORY}/meta:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/meta.webp
    networks:
      - net

networks:
  proxy:
    external: true
  net:
    external: false

volumes:
  db: {}
