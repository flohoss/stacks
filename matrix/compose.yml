services:
  matrix:
    image: matrixdotorg/synapse:v1.162.0@sha256:6b84a7bbac36f080b2d2e51e0289cf1b08b349598ea44a558df38d558f2c2311
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '2G'
          cpus: '2.0'
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${BASE_DOMAIN}
      SYNAPSE_REPORT_STATS: no
      POSTGRES_PASSWORD: password
      UID: 991
      GID: 991
    volumes:
      - ${DIRECTORY}:/data
    ports:
      - ${PORT:-8008}:8008
    networks:
      - net

  db:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
    labels:
      - backup.target=${BACKUP_TARGET:-matrix}
    expose:
      - 5432
    networks:
      - net

  signal:
    image: dock.mau.dev/mautrix/signal:v26.09@sha256:bbaa0910758a09093b686bcd2a93c5ccff6530e3a00f83bda21c2c347d0060c6
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/signal:/data
    networks:
      - net

  telegram:
    image: dock.mau.dev/mautrix/telegram:v26.09@sha256:03e79bcf076da566a9984b0bc06151acbf71e3df9cd2e291142713ad9ebff980
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/telegram:/data
    networks:
      - net

  whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:v26.09@sha256:e92b5217929622aabfea3cf72b279d1b73790a035a293d7149bcce7ae220b86f
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/whatsapp:/data
    networks:
      - net

  meta:
    image: dock.mau.dev/mautrix/meta:v26.09@sha256:a8538857cc2b06c01854c1bc7ddaa0eb0975a9da4aefb4a70af907b0cad16b6b
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/meta:/data
    networks:
      - net

networks:
  net:
    external: false

volumes:
  db: {}
