services:
  matrix:
    image: matrixdotorg/synapse:v1.161.0@sha256:6b95dd129e35e97e8032cb759e5db4a516a5f7ef6c98d34d716fea1ae239b62a
    restart: always
    deploy:
      resources:
        limits:
          memory: '2G'
          cpus: '2.0'
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${BASE_DOMAIN}
      SYNAPSE_REPORT_STATS: no
      POSTGRES_PASSWORD: password
      UID: 991
      GID: 991
    volumes:
      - ${DIRECTORY}:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/synapse.webp
      - traefik.enable=true
      - traefik.http.routers.matrix.entrypoints=https
      - traefik.http.routers.matrix.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.matrix.tls=true
      - traefik.http.routers.matrix.tls.certresolver=hetzner
      - traefik.http.routers.matrix.priority=1
      - traefik.http.routers.matrix.service=matrix
      - traefik.http.services.matrix.loadbalancer.server.port=8008
    networks:
      - proxy
      - net

  matrix-wellknown:
    image: nginxinc/nginx-unprivileged:1.31.6@sha256:31e97ebaac04c19c8e7da6012c5776e86a4414695565200719d6113cb68d0b78
    restart: always
    deploy:
      resources:
        limits:
          memory: '128M'
          cpus: '0.25'
    environment:
      SYNAPSE_DOMAIN: ${DOMAIN}
    command: |
      /bin/sh -c "
      mkdir -p /tmp/www/.well-known/matrix
      echo '{\"m.homeserver\": {\"base_url\": \"https://${DOMAIN}\"}}' > /tmp/www/.well-known/matrix/client
      echo '{\"m.server\": \"${DOMAIN}:443\"}' > /tmp/www/.well-known/matrix/server
      cat > /tmp/nginx.conf << 'EOF'
      pid /tmp/nginx.pid;
      events { worker_connections 1024; }

      http {
        server {
          listen 8080;
          server_name _;
          location /.well-known/matrix/ {
            root /tmp/www;
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            try_files \$$uri =404;
          }
        }
      }
      EOF
      nginx -c /tmp/nginx.conf -g 'daemon off;'
      "
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}/.well-known/matrix/server
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/nginx.webp
      - traefik.enable=true
      - traefik.http.routers.matrix-wellknown.entrypoints=https
      - traefik.http.routers.matrix-wellknown.rule=Host(`${DOMAIN}`) && PathPrefix(`/.well-known/matrix/`)
      - traefik.http.routers.matrix-wellknown.tls=true
      - traefik.http.routers.matrix-wellknown.tls.certresolver=hetzner
      - traefik.http.routers.matrix-wellknown.priority=100
    expose:
      - 8080
    networks:
      - proxy

  db:
    image: postgres:17.11@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    restart: always
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
    labels:
      - backup.target=${BACKUP_TARGET:-matrix}
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postgresql.webp
    expose:
      - 5432
    networks:
      - net

  signal:
    image: dock.mau.dev/mautrix/signal:v26.09@sha256:bbaa0910758a09093b686bcd2a93c5ccff6530e3a00f83bda21c2c347d0060c6
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/signal:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/signal.webp
    networks:
      - net

  telegram:
    image: dock.mau.dev/mautrix/telegram:v26.09@sha256:03e79bcf076da566a9984b0bc06151acbf71e3df9cd2e291142713ad9ebff980
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/telegram:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/telegram.webp
    networks:
      - net

  whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:v26.09@sha256:e92b5217929622aabfea3cf72b279d1b73790a035a293d7149bcce7ae220b86f
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/whatsapp:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/whatsapp.webp
    networks:
      - net

  meta:
    image: dock.mau.dev/mautrix/meta:v26.09@sha256:a8538857cc2b06c01854c1bc7ddaa0eb0975a9da4aefb4a70af907b0cad16b6b
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/meta:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/meta.webp
    networks:
      - net

networks:
  proxy:
    external: true
  net:
    external: false

volumes:
  db: {}
