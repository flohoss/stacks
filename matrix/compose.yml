services:
  matrix:
    image: matrixdotorg/synapse:v1.158.0@sha256:5f868df1f5772907c6dbe973a9b69ab530a5d6bb317c011a3788f7ad78eb1292
    restart: always
    deploy:
      resources:
        limits:
          memory: '2G'
          cpus: '2.0'
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${BASE_DOMAIN}
      SYNAPSE_REPORT_STATS: no
      POSTGRES_PASSWORD: password
      UID: 991
      GID: 991
    volumes:
      - ${DIRECTORY}:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/synapse.webp
      - traefik.enable=true
      - traefik.http.routers.matrix.entrypoints=https
      - traefik.http.routers.matrix.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.matrix.tls=true
      - traefik.http.routers.matrix.tls.certresolver=desec
      - traefik.http.routers.matrix.priority=1
      - traefik.http.routers.matrix.service=matrix
      - traefik.http.services.matrix.loadbalancer.server.port=8008
    networks:
      - proxy
      - net

  matrix-wellknown:
    image: nginxinc/nginx-unprivileged:1.31.3@sha256:1ab63ed666197d757cd3ce0ad84c5136f18f774465345785f33423bd1bba4353
    restart: always
    deploy:
      resources:
        limits:
          memory: '128M'
          cpus: '0.25'
    environment:
      SYNAPSE_DOMAIN: ${DOMAIN}
    command: |
      /bin/sh -c "
      mkdir -p /tmp/www/.well-known/matrix
      echo '{\"m.homeserver\": {\"base_url\": \"https://${DOMAIN}\"}}' > /tmp/www/.well-known/matrix/client
      echo '{\"m.server\": \"${DOMAIN}:443\"}' > /tmp/www/.well-known/matrix/server
      cat > /tmp/nginx.conf << 'EOF'
      pid /tmp/nginx.pid;
      events { worker_connections 1024; }

      http {
        server {
          listen 8080;
          server_name _;
          location /.well-known/matrix/ {
            root /tmp/www;
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            try_files \$$uri =404;
          }
        }
      }
      EOF
      nginx -c /tmp/nginx.conf -g 'daemon off;'
      "
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}/.well-known/matrix/server
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/nginx.webp
      - traefik.enable=true
      - traefik.http.routers.matrix-wellknown.entrypoints=https
      - traefik.http.routers.matrix-wellknown.rule=Host(`${DOMAIN}`) && PathPrefix(`/.well-known/matrix/`)
      - traefik.http.routers.matrix-wellknown.tls=true
      - traefik.http.routers.matrix-wellknown.tls.certresolver=desec
      - traefik.http.routers.matrix-wellknown.priority=100
    expose:
      - 8080
    networks:
      - proxy

  db:
    image: postgres:17.11@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
    restart: always
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d db']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data
    labels:
      - backup.target=${BACKUP_TARGET:-matrix}
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/postgresql.webp
    expose:
      - 5432
    networks:
      - net

  signal:
    image: dock.mau.dev/mautrix/signal:v26.08@sha256:edafbdfa23366715a5ca9e4c3a5d08efd01e1ff86212d683e1e5c16b681fa2f3
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/signal:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/signal.webp
    networks:
      - net

  telegram:
    image: dock.mau.dev/mautrix/telegram:v26.08@sha256:c073961f95aafca58392affcb57ea74364a2d17f018a36d29a208828db8a11e8
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/telegram:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/telegram.webp
    networks:
      - net

  whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:v26.08@sha256:86237c4d0d33a1e08910b1f820e6c561f9b8e21dc26943caf266e01021087002
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/whatsapp:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/whatsapp.webp
    networks:
      - net

  meta:
    image: dock.mau.dev/mautrix/meta:v26.08@sha256:662f3d52249304c44c91cbc3d3552eced3e5baf93916be7c6b17a47677036de8
    restart: always
    depends_on:
      matrix:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.25'
    volumes:
      - ${DIRECTORY}/meta:/data
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/meta.webp
    networks:
      - net

networks:
  proxy:
    external: true
  net:
    external: false

volumes:
  db: {}
