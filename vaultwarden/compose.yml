services:
  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    restart: always
    logging:
      options:
        max-size: 5m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: '256M'
          cpus: '0.5'
    volumes:
      - ${DIRECTORY}/data:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localhost:8080}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/vaultwarden.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:8080}:80'
    networks:
      - proxy

networks:
  proxy:
    external: true
