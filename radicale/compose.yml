services:
  radicale:
    image: tomsquest/docker-radicale:3.7.3.0@sha256:265195d889c122bb64367a84ce36ff5dc3ab88b6f5a26321af7d41be6a5da2d0
    restart: always
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    deploy:
      resources:
        limits:
          pids: 50
          memory: 256M
    volumes:
      - ${DIRECTORY}/data:/data
      - ${DIRECTORY}/config:/config:ro
    labels:
      - net.unraid.docker.managed=dockhand
      - net.unraid.docker.webui=https://${DOMAIN}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/radicale.webp
      - traefik.enable=true
      - traefik.http.routers.radicale.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.radicale.entrypoints=https
    expose:
      - 5232
    networks:
      - proxy

networks:
  proxy:
    external: true
