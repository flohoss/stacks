services:
  snapotter:
    image: snapotter/snapotter:2.3.0@sha256:8fa3520ac018e717e2009ee461f84835562e0f18b09c759ffd7cc4d46e792c20
    restart: always
    logging:
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: '1G'
          cpus: '2.0'
    environment:
      TZ: Europe/Berlin
      AUTH_ENABLED: false
      LOG_LEVEL: warn
      DEFAULT_THEME: dark
    volumes:
      - snapotter:/data
    labels:
      - net.unraid.docker.managed=composeman
      - net.unraid.docker.webui=http://${HOST_BINDING:-localehost:1349}
      - net.unraid.docker.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/snapotter.webp
    ports:
      - '${HOST_BINDING:-127.0.0.1:1349}:1349'

volumes:
  snapotter: {}
